name: Revival Metric Depth Sanity

on:
  workflow_dispatch:
  push:
    branches:
      - "revival/phase1c-depth-validation"
    paths:
      - "revival/tools/touchplus-depth-sanity.py"
      - "revival/calibration/candidates/**"
      - "revival/notes/phase1c-depth-validation.md"
      - ".github/workflows/revival-depth-sanity.yml"
  pull_request:
    paths:
      - "revival/tools/touchplus-depth-sanity.py"
      - "revival/calibration/candidates/**"
      - "revival/notes/phase1c-depth-validation.md"
      - ".github/workflows/revival-depth-sanity.yml"

jobs:
  depth-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless

      - name: Compile depth sanity tool
        run: python -m py_compile revival/tools/touchplus-depth-sanity.py

      - name: Exercise CLI
        run: python revival/tools/touchplus-depth-sanity.py --help

      - name: Validate physically accepted candidate calibration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('revival/calibration/candidates/0101007379.json')
          data = json.loads(p.read_text())
          required = ['device_serial','image_size','K1','D1','K2','D2','R1','R2','P1','P2','Q','physical_validation']
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f'Missing keys: {missing}')
          if data['device_serial'] != '0101007379':
              raise SystemExit('Unexpected candidate serial')
          if data.get('promotion_state') != 'candidate_physical_depth_validated':
              raise SystemExit('Candidate physical-validation state is not accepted')
          pv = data['physical_validation']
          if pv.get('status') != 'PASS':
              raise SystemExit('Physical depth validation is not PASS')
          if pv.get('raw_test_images_committed') is not False:
              raise SystemExit('Raw physical test images must not be committed')
          test = pv.get('depth_test', {})
          if test.get('near_far_ordering') != 'PASS' or test.get('dense_disparity_coherence') != 'PASS':
              raise SystemExit('Physical depth sanity gates are not PASS')
          if abs(float(test.get('delta_scale_error_percent', 999))) > 5.0:
              raise SystemExit('Metric delta scale error exceeds Phase 1C smoke gate')
          print('candidate physical metric-depth sanity: PASS')
          PY
