name: Revival Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - "revival/**"
    paths:
      - "revival/**"
      - ".github/workflows/revival-windows.yml"
  pull_request:
    paths:
      - "revival/**"
      - ".github/workflows/revival-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Revival source
        id: source
        shell: pwsh
        run: |
          if (Test-Path "revival/CMakeLists.txt") {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "Revival source is not present on this baseline branch yet."
          }

      - name: Configure
        if: steps.source.outputs.present == 'true'
        run: cmake -S revival -B build/revival -A x64

      - name: Build
        if: steps.source.outputs.present == 'true'
        run: cmake --build build/revival --config Release

      - name: Locate probe binaries
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $camera = Get-ChildItem -Path build/revival -Recurse -Filter touchplus_probe.exe | Select-Object -First 1
          $usb = Get-ChildItem -Path build/revival -Recurse -Filter touchplus_usb_probe.exe | Select-Object -First 1
          if (-not $camera) { throw "touchplus_probe.exe was not produced" }
          if (-not $usb) { throw "touchplus_usb_probe.exe was not produced" }
          Write-Host "Built camera probe: $($camera.FullName)"
          Write-Host "Built USB probe:    $($usb.FullName)"

      - name: Upload standalone probes
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-probes-windows-x64
          path: |
            build/revival/**/touchplus_probe.exe
            build/revival/**/touchplus_usb_probe.exe
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Phase 0B Etron unlock kit
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $kit = "build/revival-unlock-kit"
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          Copy-Item "revival/tools/touchplus-unlock.ps1" "$kit/touchplus-unlock.ps1"
          Copy-Item "build/eSPAEAWBCtrl.dll" "$kit/eSPAEAWBCtrl.dll"
          Copy-Item "build/eSPDI.dll" "$kit/eSPDI.dll"
          Copy-Item "build/EtLib.dll" "$kit/EtLib.dll"
          Get-ChildItem $kit | Format-Table Name,Length

      - name: Upload Phase 0B Etron unlock kit
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-phase0b-etron-unlock-kit
          path: build/revival-unlock-kit/*
          if-no-files-found: error
          retention-days: 30
