name: Revival Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - "revival/**"
    paths:
      - "revival/**"
      - ".github/workflows/revival-windows.yml"
  pull_request:
    paths:
      - "revival/**"
      - ".github/workflows/revival-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Revival source
        id: source
        shell: pwsh
        run: |
          if (Test-Path "revival/CMakeLists.txt") {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "Revival source is not present on this baseline branch yet."
          }

      - name: Configure
        if: steps.source.outputs.present == 'true'
        run: cmake -S revival -B build/revival -A x64

      - name: Build
        if: steps.source.outputs.present == 'true'
        run: cmake --build build/revival --config Release

      - name: Locate probe binary
        if: steps.source.outputs.present == 'true'
        id: binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/revival -Recurse -Filter touchplus_probe.exe | Select-Object -First 1
          if (-not $exe) { throw "touchplus_probe.exe was not produced" }
          Write-Host "Built: $($exe.FullName)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload standalone probe
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-probe-windows-x64
          path: ${{ steps.binary.outputs.path }}
          if-no-files-found: error
          retention-days: 30
