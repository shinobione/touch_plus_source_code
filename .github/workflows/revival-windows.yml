name: Revival Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - "revival/**"
    paths:
      - "revival/**"
      - ".github/workflows/revival-windows.yml"
  pull_request:
    paths:
      - "revival/**"
      - ".github/workflows/revival-windows.yml"

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Revival source
        id: source
        shell: pwsh
        run: |
          if (Test-Path "revival/CMakeLists.txt") {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "Revival source is not present on this baseline branch yet."
          }

      - name: Configure x64
        if: steps.source.outputs.present == 'true'
        run: cmake -S revival -B build/revival -A x64

      - name: Build x64
        if: steps.source.outputs.present == 'true'
        run: cmake --build build/revival --config Release

      - name: Locate x64 probe binaries
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $camera = Get-ChildItem -Path build/revival -Recurse -Filter touchplus_probe.exe | Select-Object -First 1
          $usb = Get-ChildItem -Path build/revival -Recurse -Filter touchplus_usb_probe.exe | Select-Object -First 1
          if (-not $camera) { throw "touchplus_probe.exe was not produced" }
          if (-not $usb) { throw "touchplus_usb_probe.exe was not produced" }
          Write-Host "Built camera probe: $($camera.FullName)"
          Write-Host "Built USB probe:    $($usb.FullName)"

      - name: Upload standalone x64 probes
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-probes-windows-x64
          path: |
            build/revival/**/touchplus_probe.exe
            build/revival/**/touchplus_usb_probe.exe
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Phase 0B Etron unlock kit
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $kit = "build/revival-unlock-kit"
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          Copy-Item "revival/tools/touchplus-unlock.ps1" "$kit/touchplus-unlock.ps1"
          Copy-Item "build/eSPAEAWBCtrl.dll" "$kit/eSPAEAWBCtrl.dll"
          Copy-Item "build/eSPDI.dll" "$kit/eSPDI.dll"
          Copy-Item "build/EtLib.dll" "$kit/EtLib.dll"
          Get-ChildItem $kit | Format-Table Name,Length

      - name: Upload Phase 0B Etron unlock kit
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-phase0b-etron-unlock-kit
          path: build/revival-unlock-kit/*
          if-no-files-found: error
          retention-days: 30

  build-win32:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Revival source
        id: source
        shell: pwsh
        run: |
          if (Test-Path "revival/CMakeLists.txt") {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "Revival source is not present on this baseline branch yet."
          }

      - name: Configure Win32
        if: steps.source.outputs.present == 'true'
        run: cmake -S revival -B build/revival-x86 -A Win32

      - name: Build Win32 Revival targets
        if: steps.source.outputs.present == 'true'
        run: cmake --build build/revival-x86 --config Release

      - name: Verify Phase 0C atomic kit
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $dir = "build/revival-x86/Release"
          $required = @(
            "touchplus_atomic_probe.exe",
            "eSPAEAWBCtrl.dll",
            "eSPDI.dll",
            "EtLib.dll"
          )
          foreach ($name in $required) {
            $path = Join-Path $dir $name
            if (-not (Test-Path $path)) { throw "Missing Phase 0C artifact: $path" }
          }
          Get-ChildItem $dir | Where-Object { $_.Name -in $required } | Format-Table Name,Length

      - name: Upload Phase 0C atomic probe kit
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-phase0c-atomic-windows-x86
          path: |
            build/revival-x86/Release/touchplus_atomic_probe.exe
            build/revival-x86/Release/eSPAEAWBCtrl.dll
            build/revival-x86/Release/eSPDI.dll
            build/revival-x86/Release/EtLib.dll
          if-no-files-found: error
          retention-days: 30

      - name: Detect Phase 1 stereo viewer
        if: steps.source.outputs.present == 'true'
        id: viewer
        shell: pwsh
        run: |
          $dir = "build/revival-x86/Release"
          $required = @(
            "touchplus_stereo_viewer.exe",
            "touchplus_timing_probe.exe",
            "touchplus_directshow_timing_probe.exe",
            "touchplus_directshow_legacy_timing_probe.exe"
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $dir $_)) })
          if ($missing.Count -eq 0) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "Missing Phase 1 binaries: $($missing -join ', ')"
          }

      - name: Upload Phase 1 stereo viewer kit
        if: steps.viewer.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-phase1-stereo-viewer-windows-x86
          path: |
            build/revival-x86/Release/touchplus_stereo_viewer.exe
            build/revival-x86/Release/touchplus_timing_probe.exe
            build/revival-x86/Release/touchplus_directshow_timing_probe.exe
            build/revival-x86/Release/touchplus_directshow_legacy_timing_probe.exe
            revival/tools/touchplus-unlock.ps1
            build/revival-x86/Release/eSPAEAWBCtrl.dll
            build/revival-x86/Release/eSPDI.dll
            build/revival-x86/Release/EtLib.dll
          if-no-files-found: error
          retention-days: 30

      - name: Self-test Phase 1C live depth viewer
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $exe = "build/revival-x86/Release/touchplus_depth_viewer.exe"
          $cal = "revival/calibration/candidates/0101007379.json"
          if (-not (Test-Path $exe)) { throw "touchplus_depth_viewer.exe was not produced" }
          & $exe --self-test $cal
          if ($LASTEXITCODE -ne 0) { throw "Depth viewer self-test failed with exit code $LASTEXITCODE" }

      - name: Prepare Phase 1C live depth viewer kit
        if: steps.source.outputs.present == 'true'
        shell: pwsh
        run: |
          $src = "build/revival-x86/Release"
          $kit = "build/revival-depth-viewer-kit"
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          New-Item -ItemType Directory -Force -Path "$kit/calibration" | Out-Null
          Copy-Item "$src/touchplus_depth_viewer.exe" "$kit/touchplus_depth_viewer.exe"
          Copy-Item "$src/eSPAEAWBCtrl.dll" "$kit/eSPAEAWBCtrl.dll"
          Copy-Item "$src/eSPDI.dll" "$kit/eSPDI.dll"
          Copy-Item "$src/EtLib.dll" "$kit/EtLib.dll"
          Copy-Item "revival/calibration/candidates/0101007379.json" "$kit/calibration/0101007379.json"
          @'
          TouchPlus Revival - Phase 1C live depth viewer

          Close Windows Camera and every other Touch+ viewer first.
          Run: .\touchplus_depth_viewer.exe

          Default: RECTIFIED LEFT | DEPTH HEATMAP.
          Move the mouse over texture to read hardened full-resolution camera-coordinate Z in mm.
          D = depth view, S = rectified stereo, ESC/Q = quit.

          LOCKED PROBE DIAGNOSTIC:
          1. Put the cursor on a textured detail and keep the target still.
          2. Press P once to lock that exact image coordinate.
          3. Watch the console: every 15 samples it reports sample count, valid %, median Z, MAD and confidence.
          4. Press P again to print the final summary and unlock.
          5. Prefer a conservative invalid sample over a confident false Z.

          Confidence guide:
          HIGH   = >=50% valid, >=12 valid samples, MAD <=8 mm
          MEDIUM = >=25% valid, >=6 valid samples, MAD <=20 mm
          LOW    = otherwise

          The packaged calibration is physically validated for Touch+ serial 0101007379.
          The executable reads the hardware serial from flash and refuses a mismatched calibration.
          Heatmap disparity is a dependency-free live diagnostic matcher; offline StereoSGBM remains the reference diagnostic.
          '@ | Set-Content -Encoding UTF8 "$kit/README-depth-viewer.txt"
          Get-ChildItem -Recurse $kit | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Phase 1C live depth viewer kit
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-phase1c-live-depth-viewer-windows-x86
          path: build/revival-depth-viewer-kit/**
          if-no-files-found: error
          retention-days: 30