name: Revival Fingertip 3D

on:
  workflow_dispatch:
  push:
    branches:
      - "revival/**"
    paths:
      - "revival/**"
      - ".github/workflows/revival-fingertip.yml"
  pull_request:
    paths:
      - "revival/**"
      - ".github/workflows/revival-fingertip.yml"

jobs:
  fingertip-math-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure tracker x64
        run: cmake -S revival/phase2b_test -B build/fingertip-x64 -A x64

      - name: Build tracker self-test x64
        run: cmake --build build/fingertip-x64 --config Release

      - name: Run tracker self-test x64
        shell: pwsh
        run: |
          & "build/fingertip-x64/Release/touchplus_fingertip_tracker_selftest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Phase 2B tracker x64 self-test failed: $LASTEXITCODE" }

  landmark-guided-distal-probe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap official OpenCV Zoo landmark assets
        shell: pwsh
        run: |
          & revival/tools/setup-touchplus-landmark-probe.ps1 `
            -Python (Get-Command python).Source `
            -Assets "build/landmark-assets" `
            -Venv "build/landmark-venv"

      - name: Run Phase 2B.9B distal-projection self-test
        shell: pwsh
        run: |
          & "build/landmark-venv/Scripts/python.exe" `
            revival/tools/touchplus_landmark_probe.py `
            --self-test
          if ($LASTEXITCODE -ne 0) { throw "Phase 2B.9B landmark-guided distal self-test failed: $LASTEXITCODE" }

      - name: Run OpenCV Zoo model-load smoke
        shell: pwsh
        run: |
          $bytes = New-Object byte[] (640 * 480)
          $header = [System.Text.Encoding]::ASCII.GetBytes("P5`n640 480`n255`n")
          $stream = [System.IO.File]::Open("build/blank-left.pgm", [System.IO.FileMode]::Create)
          $stream.Write($header, 0, $header.Length)
          $stream.Write($bytes, 0, $bytes.Length)
          $stream.Close()

          & "build/landmark-venv/Scripts/python.exe" `
            revival/tools/touchplus_landmark_probe.py `
            --input "build/blank-left.pgm" `
            --assets "build/landmark-assets" `
            --output "build/landmark-smoke"
          if ($LASTEXITCODE -ne 0) { throw "Phase 2B.9B OpenCV Zoo model-load smoke failed: $LASTEXITCODE" }
          $summary = Get-Content "build/landmark-smoke/landmark-guided-summary.json" -Raw | ConvertFrom-Json
          if ($summary.results[0].guided_status -eq "ERROR") {
            throw "Landmark model smoke returned ERROR: $($summary.results[0].reason)"
          }
          if ($summary.metric_z_source -ne "TOUCHPLUS_STEREO_ONLY") {
            throw "Metric-depth ownership regressed: $($summary.metric_z_source)"
          }
          if ($summary.exact_tip_oracle_policy -ne "DISABLED_AFTER_2B9A_PHYSICAL_FAIL") {
            throw "2B.9A exact-tip oracle must remain disabled"
          }

  phase2b-win32:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure tracker Win32
        run: cmake -S revival/phase2b_test -B build/fingertip-x86 -A Win32

      - name: Build tracker self-test Win32
        run: cmake --build build/fingertip-x86 --config Release

      - name: Run tracker self-test Win32
        shell: pwsh
        run: |
          & "build/fingertip-x86/Release/touchplus_fingertip_tracker_selftest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Phase 2B tracker Win32 self-test failed: $LASTEXITCODE" }

      - name: Configure Revival Win32
        run: cmake -S revival -B build/revival-x86 -A Win32

      - name: Build Revival Win32
        run: cmake --build build/revival-x86 --config Release

      - name: Run Phase 2A surface regression
        shell: pwsh
        run: |
          & "build/revival-x86/Release/touchplus_surface_frame_selftest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Phase 2A surface self-test regressed: $LASTEXITCODE" }

      - name: Run Phase 1C calibration/Q regression
        shell: pwsh
        run: |
          $exe = "build/revival-x86/Release/touchplus_depth_viewer.exe"
          $cal = "revival/calibration/candidates/0101007379.json"
          if (-not (Test-Path $exe)) { throw "touchplus_depth_viewer.exe was not produced" }
          & $exe --self-test $cal
          if ($LASTEXITCODE -ne 0) { throw "Phase 1C depth self-test regressed: $LASTEXITCODE" }

      - name: Prepare Phase 2B.9B landmark-guided distal kit
        shell: pwsh
        run: |
          $src = "build/revival-x86/Release"
          $kit = "build/touchplus-phase2b9b-landmark-guided-distal"
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          New-Item -ItemType Directory -Force -Path "$kit/calibration" | Out-Null

          # The physical tracker remains the accepted V8 safety architecture.
          # 2B.9B is still an offline anatomical evaluation: OpenCV/ONNX does
          # not enter the Etron Win32 runtime and never owns metric Z.
          Copy-Item "$src/touchplus_depth_viewer.exe" "$kit/touchplus_phase2b_tracker.exe"
          if (Test-Path "$src/touchplus_calibration_capture.exe") {
            Copy-Item "$src/touchplus_calibration_capture.exe" "$kit/touchplus_landmark_capture.exe"
          }
          Copy-Item "$src/eSPAEAWBCtrl.dll" "$kit/eSPAEAWBCtrl.dll"
          Copy-Item "$src/eSPDI.dll" "$kit/eSPDI.dll"
          Copy-Item "$src/EtLib.dll" "$kit/EtLib.dll"
          Copy-Item "revival/calibration/candidates/0101007379.json" "$kit/calibration/0101007379.json"
          Copy-Item "revival/tools/touchplus_landmark_probe.py" "$kit/touchplus_landmark_probe.py"
          Copy-Item "revival/tools/setup-touchplus-landmark-probe.ps1" "$kit/setup-touchplus-landmark-probe.ps1"
          Copy-Item "revival/notes/phase2b8-physical-smoke-2026-08-20.md" "$kit/README-2B8-physical-smoke.md"
          Copy-Item "revival/notes/phase2b9-landmark-oracle-evaluation.md" "$kit/README-2B9A-physical-result.md"
          Copy-Item "revival/notes/phase2b9b-landmark-guided-distal.md" "$kit/README-2B9B-guided-distal.md"
          Copy-Item "revival/notes/phase2b8-landmark-fallback-evaluation.md" "$kit/README-landmark-background.md"
          Get-ChildItem -Recurse $kit | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Phase 2B.9B landmark-guided distal kit
        uses: actions/upload-artifact@v4
        with:
          name: touchplus-phase2b9b-landmark-guided-distal-windows
          path: build/touchplus-phase2b9b-landmark-guided-distal/**
          if-no-files-found: error
          retention-days: 30